<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.5">
  <title>科技风抽号系统 · 量子随机舱</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 30% 30%, #0b0f1c, #02040a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Orbitron', 'Arial', sans-serif;
      padding: 1.5rem;
      margin: 0;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* 科技网格背景 */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* 主卡片：全息科技容器 */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 750px;
      background: rgba(8, 18, 28, 0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 255, 255, 0.3);
      box-shadow: 0 0 60px rgba(0, 180, 255, 0.4), inset 0 0 30px rgba(0, 255, 200, 0.2);
      border-radius: 3.5rem;
      padding: 2rem 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
    }

    /* 顶部标题区域 */
    .title-section {
      width: 100%;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .main-title {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.3rem;
      text-transform: uppercase;
      background: linear-gradient(180deg, #c0f0ff 0%, #4df0ff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 15px #00e0ff);
      margin-bottom: 0.2rem;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
    }

    .sub-title {
      color: #8aa0b0;
      font-size: 0.9rem;
      letter-spacing: 0.2rem;
      text-transform: uppercase;
      border-top: 1px solid rgba(0, 255, 255, 0.4);
      display: inline-block;
      padding-top: 0.5rem;
      margin-top: 0.2rem;
    }

    /* 动态大圆圈 - 核心展示区 */
    .circle-frame {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 1.8rem 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .big-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(0, 20, 40, 0.75);
      backdrop-filter: blur(12px);
      border: 3px solid rgba(0, 255, 255, 0.7);
      box-shadow: 0 0 45px rgba(0, 180, 255, 0.8), inset 0 0 35px rgba(0, 255, 200, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
      position: relative;
      z-index: 2;
    }

    /* 金色状态 */
    .big-circle.golden {
      background: radial-gradient(circle at 30% 30%, #ffd966, #b8860b);
      border: 3px solid #ffbb2e;
      box-shadow: 0 0 80px #ffaa00, inset 0 0 50px #ffcc66;
      border-color: #ffcc66;
    }

    .circle-text {
      font-size: 4.5rem;
      font-weight: 800;
      color: #e0f0ff;
      text-shadow: 0 0 25px #00ffff, 0 0 10px #0077ff;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      letter-spacing: 2px;
      transition: color 0.2s;
    }

    .big-circle.golden .circle-text {
      color: #1a1e2b;
      text-shadow: 0 0 20px #ffdd88, 0 0 8px #ffffff;
    }

    /* 环绕科技光圈 */
    .circle-frame::before {
      content: "";
      position: absolute;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #00ffff, #0055ff, #aa00ff, #00ffff);
      opacity: 0.5;
      filter: blur(18px);
      z-index: 0;
      animation: spinGlow 6s infinite linear;
    }

    @keyframes spinGlow {
      0% { transform: rotate(0deg); opacity: 0.5; }
      50% { opacity: 0.8; }
      100% { transform: rotate(360deg); opacity: 0.5; }
    }

    /* 下方号码网格 (即将抽的号) */
    .numbers-grid {
      width: 100%;
      background: rgba(0, 10, 20, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 255, 0.25);
      border-radius: 2.5rem;
      padding: 1.2rem 1rem;
      margin: 1rem 0 1.8rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      min-height: 90px;
    }

    .number-badge {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: rgba(20, 40, 60, 0.7);
      backdrop-filter: blur(5px);
      border: 1px solid #00ccff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.3rem;
      color: #b0f0ff;
      text-shadow: 0 0 10px #00a6ff;
      box-shadow: 0 0 15px rgba(0, 160, 255, 0.5);
      transition: all 0.2s ease;
      position: relative;
      background: linear-gradient(145deg, #102433, #05101c);
    }

    /* 已淘汰样式：灰色+左上角叉号 */
    .number-badge.eliminated {
      background: #1e2a32;
      border-color: #4a5560;
      color: #5f6b7a;
      text-shadow: none;
      box-shadow: 0 0 5px #2d3748;
      position: relative;
      opacity: 0.65;
    }

    .number-badge.eliminated::after {
      content: "✕";
      position: absolute;
      top: -6px;
      left: -6px;
      font-size: 1.2rem;
      color: #ff5e7e;
      font-weight: bold;
      text-shadow: 0 0 8px black;
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* 控制按钮组 */
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 0.5rem;
    }

    .tech-btn {
      background: rgba(0, 20, 40, 0.75);
      backdrop-filter: blur(15px);
      border: 1px solid #00e0ff;
      color: #d0f0ff;
      padding: 0.9rem 2rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.15rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 180, 255, 0.6);
      transition: 0.25s;
      background: linear-gradient(135deg, #0a1a2f, #021024);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .tech-btn:hover {
      background: #0a2848;
      box-shadow: 0 0 35px #00ffff;
      border-color: #ffffff;
      color: white;
      transform: scale(1.02);
    }

    .tech-btn:active {
      transform: scale(0.96);
    }

    .reset-btn {
      border-color: #b0a0ff;
      box-shadow: 0 0 18px #7a6aff;
    }

    /* 响应式调整 */
    @media (max-width: 500px) {
      .container {
        padding: 1.5rem 1rem;
      }
      .number-badge {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }
      .big-circle {
        width: 180px;
        height: 180px;
      }
      .circle-text {
        font-size: 3.5rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="title-section">
    <h1 class="main-title">CYBER DRAW</h1>
    <div class="sub-title">量子抽取舱</div>
  </div>

  <!-- 动态大圆圈 -->
  <div class="circle-frame">
    <div class="big-circle" id="bigCircle">
      <span class="circle-text" id="circleDisplay">?</span>
    </div>
  </div>

  <!-- 下方号码池 (即将抽的号) -->
  <div class="numbers-grid" id="numbersGrid"></div>

  <!-- 操作按钮 -->
  <div class="action-buttons">
    <button class="tech-btn" id="drawBtn">▶ 抽号</button>
    <button class="tech-btn reset-btn" id="resetBtn">↺ 重新抽号</button>
  </div>
  <div style="margin-top: 0.8rem; color: #4f6b7a; font-size: 0.7rem; letter-spacing: 0.1rem;">
    [ 代码内可修改标签 ]
  </div>
</div>

<script>
  (function() {
    // ---------- ★ 可在代码内修改的配置区域 ★ ----------
    // 默认40个数字，你可以改成任意字符串数组，如 ['苹果','香蕉','橘子'...] 或者混合。
    // 数量自动适应，通过复制增加元素即可。目前默认1~40。
    const DEFAULT_ITEMS = Array.from({ length: 40 }, (_, i) => (i + 1).toString());
    
    // 如果你希望改成文字标签，取消下面注释并修改数组：
    // const DEFAULT_ITEMS = ['阿尔法', '贝塔', '伽马', '德尔塔', '厄普西隆', ...]; 
    // 也可以混合: ['01', '02', 'A', 'B', '红', '蓝'] 等。
    // ------------------------------------------------

    // 状态变量
    let items = [];                 // 当前所有项目 (字符串)
    let availableIndices = [];     // 剩余可抽索引 (数字)
    let eliminatedIndices = new Set(); // 已淘汰索引
    
    // DOM 元素
    const bigCircleEl = document.getElementById('bigCircle');
    const circleDisplayEl = document.getElementById('circleDisplay');
    const numbersGridEl = document.getElementById('numbersGrid');
    const drawBtn = document.getElementById('drawBtn');
    const resetBtn = document.getElementById('resetBtn');

    // 动画相关
    let rollingInterval = null;
    let isRolling = false;
    let currentRollingItem = '?';

    // ---------- 工具函数 ----------
    function initializeSystem() {
      // 深拷贝默认配置
      items = [...DEFAULT_ITEMS];
      // 重置状态
      availableIndices = items.map((_, idx) => idx);
      eliminatedIndices.clear();
      
      // 清除任何进行中的动画
      stopRolling();
      // 重置大圆圈样式 (移除金色)
      bigCircleEl.classList.remove('golden');
      circleDisplayEl.textContent = '?';
      
      // 重新渲染网格
      renderGrid();
    }

    // 渲染下方号码网格
    function renderGrid() {
      numbersGridEl.innerHTML = '';
      
      items.forEach((item, index) => {
        const badge = document.createElement('div');
        badge.className = 'number-badge';
        if (eliminatedIndices.has(index)) {
          badge.classList.add('eliminated');
        }
        badge.textContent = item;
        badge.setAttribute('data-index', index);
        numbersGridEl.appendChild(badge);
      });
    }

    // 更新可用索引 (基于eliminatedIndices)
    function updateAvailableIndices() {
      availableIndices = items.reduce((arr, _, idx) => {
        if (!eliminatedIndices.has(idx)) {
          arr.push(idx);
        }
        return arr;
      }, []);
    }

    // 停止滚动动画
    function stopRolling() {
      if (rollingInterval) {
        clearInterval(rollingInterval);
        rollingInterval = null;
      }
      isRolling = false;
    }

    // 从可用池中随机获取一个项目字符串
    function getRandomAvailableItem() {
      if (availableIndices.length === 0) return null;
      const randomPos = Math.floor(Math.random() * availableIndices.length);
      const idx = availableIndices[randomPos];
      return { index: idx, value: items[idx] };
    }

    // 开始在大圆圈中快速变换数字
    function startRolling() {
      if (isRolling) return;
      // 如果没有可抽号码，不能滚动
      if (availableIndices.length === 0) {
        alert('所有号码均已抽完，请重新抽号重置。');
        return;
      }
      
      stopRolling(); // 确保之前清理
      isRolling = true;
      
      // 移除金色状态 (滚动时恢复科技蓝)
      bigCircleEl.classList.remove('golden');
      
      rollingInterval = setInterval(() => {
        if (availableIndices.length === 0) {
          // 如果滚动中途没号了，停止并显示?
          stopRolling();
          circleDisplayEl.textContent = '!';
          bigCircleEl.classList.add('golden'); // 也可以提示结束
          return;
        }
        const randItem = getRandomAvailableItem();
        if (randItem) {
          circleDisplayEl.textContent = randItem.value;
          currentRollingItem = randItem.value;
        } else {
          circleDisplayEl.textContent = '?';
        }
      }, 60); // 快速变化
    }

    // 执行抽号：停止滚动并确定结果
    function performDraw() {
      if (!isRolling) {
        // 如果没在滚动，先尝试开始滚动 (用户可能直接点击抽号)
        if (availableIndices.length === 0) {
          alert('没有剩余号码可抽，请重置。');
          return;
        }
        // 自动开始滚动然后立即抽取？设计为：点击抽号如果未滚动，启动滚动一小段时间再停。
        startRolling();
        // 设定短暂延迟后停止并锁定结果
        setTimeout(() => {
          lockDrawResult();
        }, 800);
        return;
      }
      
      // 已经在滚动中：直接锁定结果
      lockDrawResult();
    }

    // 锁定抽号结果：停止滚动，确定当前显示项(或随机选一个可用)，标记淘汰
    function lockDrawResult() {
      if (!isRolling && availableIndices.length === 0) {
        return;
      }
      
      stopRolling();
      
      // 安全检查：没有可抽号码
      if (availableIndices.length === 0) {
        circleDisplayEl.textContent = '×';
        bigCircleEl.classList.add('golden');
        renderGrid();
        return;
      }
      
      // 获取当前大圆圈显示的值对应的索引 (可能对应多个相同值？取第一个未淘汰的)
      let targetIndex = -1;
      const displayValue = circleDisplayEl.textContent;
      
      // 尝试从可用池中找到匹配当前显示值的索引
      for (let idx of availableIndices) {
        if (items[idx] === displayValue) {
          targetIndex = idx;
          break;
        }
      }
      
      // 如果找不到匹配(例如显示?或异常)，随机选一个可用
      if (targetIndex === -1) {
        const randomPick = getRandomAvailableItem();
        if (randomPick) {
          targetIndex = randomPick.index;
          circleDisplayEl.textContent = randomPick.value;
        } else {
          return; // 无号码
        }
      }
      
      // 标记为淘汰
      eliminatedIndices.add(targetIndex);
      updateAvailableIndices();
      
      // 大圆圈变成金色，显示抽中号码
      bigCircleEl.classList.add('golden');
      // 确保显示抽中的值
      circleDisplayEl.textContent = items[targetIndex];
      
      // 更新网格UI
      renderGrid();
      
      // 如果所有号码抽完，可以额外提示
      if (availableIndices.length === 0) {
        console.log('所有号码已抽取完毕');
      }
    }

    // 重置整个系统 (重新抽号)
    function resetSystem() {
      stopRolling();
      // 重新初始化
      items = [...DEFAULT_ITEMS];
      availableIndices = items.map((_, idx) => idx);
      eliminatedIndices.clear();
      
      bigCircleEl.classList.remove('golden');
      circleDisplayEl.textContent = '?';
      renderGrid();
    }

    // 事件绑定
    drawBtn.addEventListener('click', () => {
      // 如果所有号已淘汰，提示
      if (availableIndices.length === 0) {
        alert('所有号码已抽完，请点击“重新抽号”开始新的一轮。');
        return;
      }
      
      if (isRolling) {
        // 正在滚动：执行锁定抽号
        performDraw();
      } else {
        // 未滚动：开始滚动 (滚动过程中再点击抽号会锁定)
        startRolling();
      }
    });

    resetBtn.addEventListener('click', () => {
      resetSystem();
    });

    // 额外：如果点击抽号时未滚动，许多用户期望直接出结果。我们可以让“抽号”按钮在静止时启动滚动，然后再次点击锁定。
    // 同时提供说明：也可以连续点击抽号触发锁定。
    // 为了更好体验，增加一个监听：如果用户在滚动时再次点击抽号，就锁定。
    // 已经在drawBtn中处理。

    // 初始化调用
    initializeSystem();

    // 可选：如果用户通过代码修改了DEFAULT_ITEMS，重新加载页面即可生效。
    // 暴露配置到全局方便控制台调试 (非必须)
    window.luckyDrawConfig = {
      getItems: () => items,
      reset: resetSystem,
      setItems: (newItems) => {
        // 动态修改默认项并重置
        if (Array.isArray(newItems) && newItems.length > 0) {
          // 由于DEFAULT_ITEMS是const，这里使用可变方式：重新赋值items并重置
          items = [...newItems];
          availableIndices = items.map((_, i) => i);
          eliminatedIndices.clear();
          stopRolling();
          bigCircleEl.classList.remove('golden');
          circleDisplayEl.textContent = '?';
          renderGrid();
          // 同时尝试修改原始引用（但const限制，建议刷新）
          console.log('已动态更新号码池，如需永久修改请编辑代码内DEFAULT_ITEMS。');
        }
      }
    };

  })();
</script>
</body>
</html>
